<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a7d3e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="GuideTalk" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
  <title>GuideTalk · 導遊團車對講 + 位置同步</title>

  <!-- Leaflet（地圖渲染） -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    :root {
      --bg: #f5f5f7;
      --card: #ffffff;
      --text: #1d1d1f;
      --text-dim: #6e6e73;
      --primary: #0a7d3e;
      --primary-dark: #086030;
      --danger: #d93b3b;
      --warning: #f4a261;
      --border: #e5e5ea;
      --shadow: 0 1px 3px rgba(0,0,0,.08), 0 4px 12px rgba(0,0,0,.04);
      --safe-top: env(safe-area-inset-top);
      --safe-bottom: env(safe-area-inset-bottom);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000;
        --card: #1c1c1e;
        --text: #f5f5f7;
        --text-dim: #9a9aa0;
        --border: #2c2c2e;
        --shadow: 0 1px 3px rgba(0,0,0,.4), 0 4px 12px rgba(0,0,0,.2);
      }
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang TC', 'Noto Sans TC', sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
      font-size: 16px;
      line-height: 1.4;
    }
    button, input { font: inherit; color: inherit; }
    input { font-size: 16px; }  /* 避免 iOS 自動 zoom */
    button { cursor: pointer; border: 0; }

    /* ─── 大型按鈕 ─── */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 14px 20px;
      border-radius: 12px;
      font-weight: 600; font-size: 16px;
      background: var(--primary); color: #fff;
      transition: transform .1s, opacity .15s;
      min-height: 48px;
    }
    .btn:active { transform: scale(0.97); }
    .btn[disabled] { opacity: .5; pointer-events: none; }
    .btn.secondary { background: var(--card); color: var(--text); border: 1px solid var(--border); }
    .btn.danger    { background: var(--danger); color: #fff; }
    .btn.full      { width: 100%; }

    /* ─── 啟動畫面 ─── */
    .screen { position: fixed; inset: 0; display: none; flex-direction: column;
              padding-top: var(--safe-top); padding-bottom: var(--safe-bottom); }
    .screen.active { display: flex; }

    .home {
      align-items: center; justify-content: center;
      padding: 24px;
    }
    .home .panel {
      width: 100%; max-width: 380px;
      background: var(--card);
      padding: 28px 22px;
      border-radius: 18px;
      box-shadow: var(--shadow);
    }
    .brand { text-align: center; margin-bottom: 18px; }
    .brand .logo { font-size: 36px; }
    .brand h1 { margin: 8px 0 4px; font-size: 24px; }
    .brand p  { margin: 0; color: var(--text-dim); font-size: 14px; }

    .field { margin: 16px 0; }
    .field label { display: block; margin-bottom: 6px; font-size: 13px; color: var(--text-dim); }
    .field input {
      width: 100%; padding: 12px 14px;
      border: 1px solid var(--border); border-radius: 10px;
      background: transparent;
    }
    .field .row { display: flex; gap: 8px; }
    .field .row input { flex: 1; text-transform: uppercase; letter-spacing: 4px; text-align: center; font-weight: 600; }

    /* 建房模式選擇 */
    .mode-radio {
      display: flex; gap: 10px; align-items: flex-start;
      padding: 10px 12px;
      border: 1px solid var(--border); border-radius: 10px;
      cursor: pointer;
      transition: background .15s;
    }
    .mode-radio:has(input:checked) {
      border-color: var(--primary);
      background: rgba(10,125,62,.08);
    }
    .mode-radio input { margin-top: 3px; flex-shrink: 0; }
    .mode-radio .mt { font-size: 14px; font-weight: 600; }
    .mode-radio .mh { font-size: 12px; color: var(--text-dim); margin-top: 2px; line-height: 1.3; }

    /* 最近房間 */
    .recent-room {
      display: flex; align-items: center; justify-content: space-between;
      gap: 10px;
      padding: 10px 14px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      cursor: pointer;
      text-align: left;
      width: 100%;
    }
    .recent-room:active { transform: scale(.98); }
    .recent-room .rcode {
      font-family: ui-monospace, Menlo, monospace; font-weight: 700;
      font-size: 16px; letter-spacing: 3px;
    }
    .recent-room .rmeta {
      font-size: 11px; color: var(--text-dim);
    }
    .recent-room .rdel {
      width: 28px; height: 28px;
      background: transparent; color: var(--text-dim);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
    }
    .recent-room .rdel:active { background: var(--border); }

    .divider { display: flex; align-items: center; margin: 18px 0;
               color: var(--text-dim); font-size: 12px; }
    .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--border); }
    .divider::before { margin-right: 10px; }
    .divider::after  { margin-left: 10px; }

    /* ─── 房間畫面 ─── */
    .room { background: var(--bg); }
    .topbar {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 14px;
      background: var(--card); border-bottom: 1px solid var(--border);
    }
    .room-code {
      font-family: ui-monospace, Menlo, monospace; font-weight: 700; font-size: 18px;
      letter-spacing: 2px;
    }
    .room-meta { font-size: 12px; color: var(--text-dim); }
    .mode-badge {
      font-size: 11px; font-weight: 600;
      padding: 3px 8px; border-radius: 999px;
      background: var(--bg); color: var(--text-dim);
      margin-left: 6px;
      white-space: nowrap;
    }
    .mode-badge.tour-text  { background: rgba(244,162,97,.18); color: #b56a2c; }
    .mode-badge.tour-voice { background: rgba(217,59,59,.16); color: var(--danger); }
    .icon-btn {
      width: 38px; height: 38px;
      display: flex; align-items: center; justify-content: center;
      background: transparent; color: var(--text);
      border-radius: 10px;
    }
    .icon-btn:active { background: var(--border); }

    .map-wrap { flex: 1; position: relative; }
    #map { position: absolute; inset: 0; }

    .peer-strip {
      position: absolute; top: 8px; left: 8px; right: 8px;
      display: flex; gap: 6px; overflow-x: auto;
      padding: 4px 0; z-index: 400;
      -webkit-overflow-scrolling: touch;
      transition: opacity .2s;
    }
    /* 距離表展開時，把上方 chip 收起來避免重複 */
    .map-wrap:has(.sheet.show) .peer-strip { opacity: 0; pointer-events: none; }
    .peer-strip::-webkit-scrollbar { display: none; }
    .peer-chip {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 10px; border-radius: 999px;
      background: rgba(255,255,255,0.95); color: #1d1d1f;
      font-size: 13px; font-weight: 600;
      box-shadow: 0 1px 3px rgba(0,0,0,.12);
      flex-shrink: 0;
      white-space: nowrap;
    }
    .peer-chip .dot { width: 10px; height: 10px; border-radius: 50%; }
    .peer-chip.ptt-on { box-shadow: 0 0 0 2px var(--primary), 0 1px 3px rgba(0,0,0,.2); }
    .peer-chip .dist { color: #6e6e73; font-weight: 500; font-size: 12px; }

    /* ─── 浮動字幕（誰在說什麼）─── */
    .subtitle-stack {
      position: absolute; left: 8px; right: 8px; top: 56px;
      display: flex; flex-direction: column; gap: 4px;
      z-index: 410; pointer-events: none;
    }
    .subtitle-bubble {
      background: rgba(0,0,0,.78); color: #fff;
      padding: 8px 12px; border-radius: 14px;
      font-size: 14px; line-height: 1.35;
      max-width: 100%; align-self: flex-start;
      box-shadow: 0 2px 8px rgba(0,0,0,.25);
      animation: subtitleIn .2s ease-out;
      border-left: 4px solid #fff;
    }
    .subtitle-bubble .who {
      font-size: 11px; opacity: .85; margin-bottom: 2px; font-weight: 600;
    }
    @keyframes subtitleIn {
      from { transform: translateY(-6px); opacity: 0; }
      to   { transform: translateY(0); opacity: 1; }
    }
    .subtitle-bubble.fade { transition: opacity .8s, transform .8s; opacity: 0; transform: translateY(-4px); }

    /* ─── 純聽眾大字幕區 ─── */
    .listener-view {
      position: absolute; inset: 0;
      background: var(--bg);
      z-index: 450;
      display: none;
      flex-direction: column;
      padding: 24px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .listener-view.active { display: flex; }
    .listener-empty {
      flex: 1; display: flex; align-items: center; justify-content: center;
      color: var(--text-dim); font-size: 15px; opacity: 0.7;
    }
    .big-subtitle-stack {
      display: flex; flex-direction: column; gap: 16px;
      justify-content: flex-end; min-height: 100%;
    }
    .big-subtitle {
      background: var(--card); border: 1px solid var(--border);
      padding: 16px 20px; border-radius: 20px;
      font-size: 20px; line-height: 1.45; font-weight: 500;
      box-shadow: 0 4px 16px rgba(0,0,0,.06);
      animation: subtitleIn .3s ease-out;
      color: var(--text);
    }
    .big-subtitle.fade { transition: opacity 1.5s; opacity: 0.3; }

    /* ─── 表格內最近一句話 ─── */
    .peer-row .pchat {
      grid-column: 2 / 4;
      margin-top: 4px;
      font-size: 13px; color: var(--text);
      background: rgba(10,125,62,.08);
      padding: 6px 10px; border-radius: 8px;
      border-left: 3px solid var(--primary);
      line-height: 1.35;
    }

    /* ─── 打字快速送訊面板 ─── */
    .quicksend-backdrop {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.3);
      opacity: 0; pointer-events: none;
      transition: opacity .2s;
      z-index: 900;
    }
    .quicksend-backdrop.show { opacity: 1; pointer-events: auto; }
    .quicksend {
      position: fixed; left: 0; right: 0; bottom: 0;
      max-height: 80vh;
      background: var(--card);
      border-top-left-radius: 18px; border-top-right-radius: 18px;
      box-shadow: 0 -2px 16px rgba(0,0,0,.18);
      transform: translateY(110%);
      transition: transform .25s ease;
      z-index: 901;
      padding: 8px 14px calc(14px + var(--safe-bottom));
      display: flex; flex-direction: column; gap: 10px;
    }
    .quicksend.show { transform: translateY(0); }
    /* 抓把 + 標題列大一點，方便點 ✕ */
    .quicksend-handle {
      width: 36px; height: 4px; border-radius: 2px;
      background: var(--border);
      margin: 4px auto 4px;
    }
    .qs-history {
      flex: 1;
      max-height: 52vh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 4px 2px;
      display: flex; flex-direction: column; gap: 6px;
    }
    .qs-history:empty::before {
      content: "還沒有訊息";
      color: var(--text-dim); font-size: 13px;
      text-align: center; padding: 16px 0;
    }
    .chat-msg {
      display: flex; flex-direction: column;
      max-width: 80%;
      padding: 8px 12px; border-radius: 14px;
      background: var(--bg);
      border-left: 3px solid var(--primary);
      font-size: 14px; line-height: 1.4;
      word-break: break-word;
    }
    .chat-msg.self {
      align-self: flex-end;
      background: rgba(10,125,62,.18);
      border-left: 0; border-right: 3px solid var(--primary);
    }
    .chat-msg .who {
      font-size: 11px; font-weight: 600;
      margin-bottom: 2px;
    }
    .chat-msg .when {
      font-size: 10px; color: var(--text-dim);
      margin-top: 2px; align-self: flex-end;
    }
    .quicksend-header {
      display: flex; align-items: center; justify-content: space-between;
    }
    .quicksend-header h3 { margin: 0; font-size: 16px; }
    /* Preset 改成橫向小貼條，不再用 2 欄大格子 */
    .qs-presets {
      display: flex; gap: 6px;
      overflow-x: auto;
      padding: 0 0 4px;
      -webkit-overflow-scrolling: touch;
    }
    .qs-presets::-webkit-scrollbar { display: none; }
    .qs-preset {
      flex-shrink: 0;
      padding: 8px 12px;
      border-radius: 999px;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 13px; font-weight: 500;
      white-space: nowrap;
    }
    .qs-preset:active { transform: scale(.96); background: var(--primary); color: #fff; border-color: var(--primary); }
    .qs-input-row {
      display: flex; gap: 8px;
    }
    .qs-input-row input {
      flex: 1;
      padding: 12px 14px;
      border: 1px solid var(--border); border-radius: 10px;
      background: transparent;
    }
    .qs-input-row .btn { padding: 12px 16px; min-height: 44px; }

    /* ─── 底部對講機 ─── */
    .bottombar {
      background: var(--card); border-top: 1px solid var(--border);
      padding: 8px 12px calc(6px + var(--safe-bottom));
      display: flex; flex-direction: column; gap: 6px;
    }
    /* 通話按鈕 + 訊息按鈕並排 */
    .ptt-row {
      display: flex; gap: 8px; align-items: stretch;
    }
    .chat-btn {
      flex-shrink: 0;
      width: 64px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      color: var(--text);
      font-size: 26px;
      display: flex; align-items: center; justify-content: center;
      transition: background .1s, transform .05s;
    }
    .chat-btn:active { transform: scale(.97); background: var(--bg); }
    /* 大按鈕 */
    .ptt {
      flex: 1;
      min-width: 0;
      min-height: 64px;
      border-radius: 16px;
      background: var(--primary); color: #fff;
      font-size: 14px; font-weight: 700;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      transition: background .15s, transform .05s;
      user-select: none; -webkit-user-select: none; touch-action: none;
      position: relative;
      padding: 0 8px;
      line-height: 1.2;
      text-align: center;
    }
    .ptt.holding,
    .ptt.live {
      background: var(--danger);
      animation: pttPulse 1.4s ease-in-out infinite;
    }
    .ptt.holding { transform: scale(.99); animation: none; }
    .ptt.muted {
      background: var(--border); color: var(--text-dim);
      animation: none;
    }
    .ptt.disabled {
      background: var(--border); color: var(--text-dim);
      animation: none;
    }
    @keyframes pttPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(217,59,59,.5); }
      50%      { box-shadow: 0 0 0 10px rgba(217,59,59,0); }
    }

    .status-line {
      font-size: 12px; color: var(--text-dim); text-align: center;
      min-height: 0;
    }
    .status-line:empty { display: none; }
    .status-line.error { color: var(--danger); }

    /* ─── 邀請對話框 ─── */
    .modal-mask {
      position: fixed; inset: 0; background: rgba(0,0,0,.4);
      display: none; align-items: center; justify-content: center;
      padding: 20px; z-index: 1000;
    }
    .modal-mask.show { display: flex; }
    .modal {
      width: 100%; max-width: 380px;
      background: var(--card); border-radius: 18px;
      padding: 22px;
      box-shadow: var(--shadow);
    }
    .modal h3 { margin: 0 0 14px; font-size: 18px; }
    .invite-code {
      font-family: ui-monospace, Menlo, monospace;
      font-size: 36px; font-weight: 800; letter-spacing: 8px;
      text-align: center; padding: 16px;
      background: var(--bg); border-radius: 12px;
      margin: 12px 0;
    }
    .invite-url {
      padding: 10px 12px; background: var(--bg); border-radius: 8px;
      font-size: 12px; color: var(--text-dim);
      word-break: break-all; user-select: all;
      margin-bottom: 12px;
    }
    .modal-actions { display: flex; gap: 8px; }
    .modal-actions .btn { flex: 1; }

    /* ─── Toast ─── */
    .toast {
      position: fixed; left: 50%; top: 16px;
      transform: translateX(-50%) translateY(-200%);
      background: rgba(0,0,0,.85); color: #fff;
      padding: 10px 18px; border-radius: 999px;
      font-size: 14px; z-index: 2000;
      transition: transform .25s ease;
      pointer-events: none;
      max-width: 90%;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }

    /* ─── Leaflet popup 客製 ─── */
    .leaflet-popup-content { margin: 8px 12px; font-size: 13px; }
    .marker-pin {
      width: 28px; height: 28px;
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      border: 2px solid #fff;
      box-shadow: 0 2px 4px rgba(0,0,0,.3);
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-weight: 700; font-size: 12px;
    }
    .marker-pin span { transform: rotate(45deg); }
    .marker-pin.me::after {
      content: ''; position: absolute;
      width: 50px; height: 50px;
      border: 2px solid currentColor;
      border-radius: 50%; opacity: .25;
      animation: pulse 2s infinite;
      transform: rotate(45deg) translate(-12px, -12px);
    }
    @keyframes pulse {
      0%   { transform: rotate(45deg) translate(-12px, -12px) scale(0.6); opacity: .5; }
      100% { transform: rotate(45deg) translate(-12px, -12px) scale(1.4); opacity: 0; }
    }

    /* ─── 距離表面板（透明，從頂部下拉，不擋地圖）─── */
    .sheet-mask {
      /* 不再需要 mask（透明面板，map 一直可互動）*/
      display: none;
    }
    .sheet {
      position: absolute;
      top: 8px; left: 8px; right: 8px;
      max-height: 60vh;
      background: rgba(255,255,255,0.86);
      backdrop-filter: blur(14px) saturate(160%);
      -webkit-backdrop-filter: blur(14px) saturate(160%);
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,.10);
      transform: translateY(-130%);
      transition: transform .25s ease, opacity .2s ease;
      opacity: 0;
      z-index: 410;
      display: flex; flex-direction: column;
      overflow: hidden;
    }
    @media (prefers-color-scheme: dark) {
      .sheet { background: rgba(28,28,30,0.82); }
    }
    .sheet.show { transform: translateY(0); opacity: 1; }
    .sheet-handle {
      width: 36px; height: 4px; border-radius: 2px;
      background: rgba(0,0,0,.18);
      margin: 8px auto 0;
    }
    .sheet-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 4px 12px 2px;
    }
    .sheet-header h3 { margin: 0; font-size: 14px; font-weight: 700; }
    .sheet-list {
      flex: 1; overflow-y: auto;
      padding: 4px 8px 8px;
      -webkit-overflow-scrolling: touch;
    }
    .peer-row {
      display: grid;
      grid-template-columns: 28px 1fr auto;
      column-gap: 10px;
      align-items: center;
      padding: 8px 10px;
      border-radius: 10px;
      background: rgba(255,255,255,0.55);
      margin-bottom: 4px;
      cursor: pointer;
    }
    @media (prefers-color-scheme: dark) {
      .peer-row { background: rgba(255,255,255,0.06); }
    }
    .peer-row:active { transform: scale(0.99); }
    .peer-row .pdot {
      width: 28px; height: 28px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-weight: 700; font-size: 13px;
    }
    .peer-row .pname { font-weight: 600; font-size: 15px; line-height: 1.2; }
    .peer-row .pmeta {
      font-size: 12px; color: var(--text-dim); margin-top: 2px;
      display: flex; gap: 8px; flex-wrap: wrap;
    }
    .peer-row .peta {
      text-align: right;
    }
    .peer-row .peta .big {
      font-size: 18px; font-weight: 700; color: var(--primary);
      line-height: 1;
    }
    .peer-row .peta .sub {
      font-size: 11px; color: var(--text-dim); margin-top: 3px;
    }
    .peer-row.self { border: 1px dashed var(--border); }
    .peer-row.self .peta .big { color: var(--text-dim); font-size: 14px; }
    .sheet-empty {
      text-align: center; color: var(--text-dim);
      font-size: 14px; padding: 36px 16px;
    }
  </style>
</head>
<body>
  <!-- 啟動畫面：建房 / 加入 -->
  <section id="screen-home" class="screen home active">
    <div class="panel">
      <div class="brand">
        <div class="logo">🚐</div>
        <h1>GuideTalk</h1>
        <p>導遊團車對講 + 位置同步</p>
      </div>

      <div class="field">
        <label>你的暱稱（給夥伴看的）</label>
        <input id="name-input" type="text" placeholder="例：阿德 / 1 號車" maxlength="24" />
      </div>

      <div class="field">
        <label>你講的語言（自動轉成字幕給夥伴看）</label>
        <select id="lang-select" style="width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:10px;background:transparent;">
          <option value="zh-TW">中文（繁體）</option>
          <option value="ja-JP">日本語</option>
          <option value="en-US">English</option>
          <option value="ko-KR">한국어</option>
          <option value="zh-CN">中文（简体）</option>
        </select>
      </div>

      <div id="create-room-section">
        <div class="field">
          <label>建房模式</label>
          <div style="display:flex;flex-direction:column;gap:6px;">
            <label class="mode-radio">
              <input type="radio" name="create-mode" value="normal" checked />
              <div>
                <div class="mt">💬 對話模式</div>
                <div class="mh">大家都能講話、聽到彼此（小群對講）</div>
              </div>
            </label>
            <label class="mode-radio">
              <input type="radio" name="create-mode" value="tour" />
              <div>
                <div class="mt">🎤 導覽機模式</div>
                <div class="mh">聽眾收看即時字幕，並收聽導遊原聲廣播</div>
              </div>
            </label>
          </div>
        </div>

        <button class="btn full" id="btn-create">建立新房間</button>

        <div class="divider">或</div>
      </div>

      <div class="field">
        <label>輸入 6 碼房號</label>
        <input id="code-input" type="text" placeholder="ABC123" maxlength="6" autocapitalize="characters" autocomplete="off" style="width:100%;padding:14px 16px;border:1px solid var(--border);border-radius:10px;background:transparent;text-transform:uppercase;letter-spacing:6px;text-align:center;font-weight:700;font-size:18px;" />
      </div>

      <button class="btn full" id="btn-join">加入房間</button>

      <!-- 最近的房間（從 localStorage 帶出，可一鍵回房）-->
      <div id="recent-rooms-wrap" style="display:none;margin-top:18px;">
        <div style="font-size:13px;color:var(--text-dim);margin-bottom:8px;">最近的房間（一鍵回房）</div>
        <div id="recent-rooms" style="display:flex;flex-direction:column;gap:6px;"></div>
      </div>

      <p style="font-size:12px;color:var(--text-dim);text-align:center;margin:18px 0 0;line-height:1.6;">
        建議第一次使用前允許「定位」與「麥克風」權限<br>
        位置只在房間內分享，不寫入伺服器
      </p>
    </div>
  </section>

  <!-- 房間畫面 -->
  <section id="screen-room" class="screen room">
    <div class="topbar">
      <button class="icon-btn" id="btn-leave" title="離開">←</button>
      <div>
        <div class="room-code" id="room-code-display">------</div>
        <div class="room-meta" id="room-meta">— 人</div>
      </div>
      <span class="mode-badge" id="mode-badge">💬 對話模式</span>
      <div style="flex:1"></div>
      <button class="icon-btn" id="btn-list" title="距離表">📋</button>
      <button class="icon-btn" id="btn-invite" title="邀請">🔗</button>
      <button class="icon-btn" id="btn-recenter" title="回到我的位置">📍</button>
    </div>

    <div class="map-wrap">
      <div id="map"></div>
      <div class="peer-strip" id="peer-strip"></div>
      <div class="subtitle-stack" id="subtitle-stack"></div>
      
      <!-- 聽眾極簡模式（大字幕） -->
      <div class="listener-view" id="listener-view">
        <div style="display:flex; justify-content:flex-end; margin-bottom: 12px; flex-shrink:0;">
          <button class="btn secondary" id="btn-listener-sos" style="padding: 8px 14px; font-size: 13px; border-radius: 999px; min-height:36px; box-shadow: 0 2px 8px rgba(0,0,0,0.05);">📍 我迷路了 (發送定位)</button>
        </div>
        <div class="listener-empty" id="listener-empty">導遊尚未發言...</div>
        <div class="big-subtitle-stack" id="big-subtitle-stack"></div>
      </div>

      <!-- 距離表（透明、從上方下拉、可摺疊）-->
      <div class="sheet" id="sheet">
        <div class="sheet-handle"></div>
        <div class="sheet-header">
          <h3>📋 全車距離表</h3>
          <button class="icon-btn" id="btn-close-sheet" style="width:30px;height:30px;font-size:16px;">✕</button>
        </div>
        <div class="sheet-list" id="sheet-list"></div>
      </div>
    </div>

    <div class="bottombar">
      <div class="ptt-row">
        <button class="ptt disabled" id="btn-ptt" title="麥克風">
          <span id="ptt-label">🎙️</span>
        </button>
        <button class="ptt live" id="btn-speaker" title="喇叭">
          <span id="spk-label">🔊</span>
        </button>
        <button class="chat-btn" id="btn-chat" title="訊息">💬</button>
      </div>
      <div class="status-line" id="status-line"></div>
    </div>
  </section>

  <!-- 邀請對話框 -->
  <div class="modal-mask" id="invite-modal">
    <div class="modal">
      <h3>邀請夥伴加入</h3>
      <p style="margin:0;font-size:13px;color:var(--text-dim);">把房號或連結傳給其他導遊：</p>
      <div class="invite-code" id="invite-code-text"></div>
      <div class="invite-url" id="invite-url-text"></div>
      <div class="modal-actions">
        <button class="btn secondary" id="btn-copy-url">複製連結</button>
        <button class="btn" id="btn-share">分享 / LINE</button>
      </div>
      <button class="btn secondary full" id="btn-close-invite" style="margin-top:8px;">關閉</button>
    </div>
  </div>

  <!-- 打字快速送訊面板 -->
  <div class="quicksend-backdrop" id="quicksend-backdrop"></div>
  <div class="quicksend" id="quicksend">
    <div class="quicksend-handle"></div>
    <div class="quicksend-header">
      <h3>💬 訊息</h3>
      <button class="icon-btn" id="btn-close-chat" style="width:36px;height:36px;font-size:18px;">✕</button>
    </div>
    <div class="qs-history" id="qs-history"></div>
    <div class="qs-presets" id="qs-presets">
      <button class="qs-preset">🚦 等紅燈</button>
      <button class="qs-preset">📍 我先到了</button>
      <button class="qs-preset">⛽ 加油中</button>
      <button class="qs-preset">😅 走錯路了</button>
      <button class="qs-preset">🙋 等我一下</button>
      <button class="qs-preset">🚐 出發囉</button>
    </div>
    <div class="qs-input-row">
      <input id="qs-input" type="text" placeholder="打字傳給全房" maxlength="100" />
      <button class="btn" id="qs-send">送出</button>
    </div>
  </div>

  <!-- sheet-mask 已不使用，留空 element 讓 main.js 不會出錯 -->
  <div id="sheet-mask" style="display:none;"></div>

  <div class="toast" id="toast"></div>

  <!-- Capacitor（iOS app 包裝時才載入到，網頁直接走 fallback） -->
  <script type="module" src="/main.js"></script>
</body>
</html>
