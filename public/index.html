<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a7d3e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="GuideTalk" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
  <title>GuideTalk · 導遊團車對講 + 位置同步</title>

  <!-- Leaflet（地圖渲染） -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    :root {
      --bg: #f5f5f7;
      --card: #ffffff;
      --text: #1d1d1f;
      --text-dim: #6e6e73;
      --primary: #0a7d3e;
      --primary-dark: #086030;
      --danger: #d93b3b;
      --warning: #f4a261;
      --border: #e5e5ea;
      --shadow: 0 1px 3px rgba(0,0,0,.08), 0 4px 12px rgba(0,0,0,.04);
      --safe-top: env(safe-area-inset-top);
      --safe-bottom: env(safe-area-inset-bottom);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000;
        --card: #1c1c1e;
        --text: #f5f5f7;
        --text-dim: #9a9aa0;
        --border: #2c2c2e;
        --shadow: 0 1px 3px rgba(0,0,0,.4), 0 4px 12px rgba(0,0,0,.2);
      }
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang TC', 'Noto Sans TC', sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
      font-size: 16px;
      line-height: 1.4;
    }
    button, input { font: inherit; color: inherit; }
    input { font-size: 16px; }  /* 避免 iOS 自動 zoom */
    button { cursor: pointer; border: 0; }

    /* ─── 大型按鈕 ─── */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 14px 20px;
      border-radius: 12px;
      font-weight: 600; font-size: 16px;
      background: var(--primary); color: #fff;
      transition: transform .1s, opacity .15s;
      min-height: 48px;
    }
    .btn:active { transform: scale(0.97); }
    .btn[disabled] { opacity: .5; pointer-events: none; }
    .btn.secondary { background: var(--card); color: var(--text); border: 1px solid var(--border); }
    .btn.danger    { background: var(--danger); color: #fff; }
    .btn.full      { width: 100%; }

    /* ─── 啟動畫面 ─── */
    .screen { position: fixed; inset: 0; display: none; flex-direction: column;
              padding-top: var(--safe-top); padding-bottom: var(--safe-bottom); }
    .screen.active { display: flex; }

    .home {
      align-items: center; justify-content: center;
      padding: 24px;
    }
    .home .panel {
      width: 100%; max-width: 380px;
      background: var(--card);
      padding: 28px 22px;
      border-radius: 18px;
      box-shadow: var(--shadow);
    }
    .brand { text-align: center; margin-bottom: 18px; }
    .brand .logo { font-size: 36px; }
    .brand h1 { margin: 8px 0 4px; font-size: 24px; }
    .brand p  { margin: 0; color: var(--text-dim); font-size: 14px; }

    .field { margin: 16px 0; }
    .field label { display: block; margin-bottom: 6px; font-size: 13px; color: var(--text-dim); }
    .field input {
      width: 100%; padding: 12px 14px;
      border: 1px solid var(--border); border-radius: 10px;
      background: transparent;
    }
    .field .row { display: flex; gap: 8px; }
    .field .row input { flex: 1; text-transform: uppercase; letter-spacing: 4px; text-align: center; font-weight: 600; }

    .divider { display: flex; align-items: center; margin: 18px 0;
               color: var(--text-dim); font-size: 12px; }
    .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--border); }
    .divider::before { margin-right: 10px; }
    .divider::after  { margin-left: 10px; }

    /* ─── 房間畫面 ─── */
    .room { background: var(--bg); }
    .topbar {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 14px;
      background: var(--card); border-bottom: 1px solid var(--border);
    }
    .room-code {
      font-family: ui-monospace, Menlo, monospace; font-weight: 700; font-size: 18px;
      letter-spacing: 2px;
    }
    .room-meta { flex: 1; font-size: 12px; color: var(--text-dim); }
    .icon-btn {
      width: 38px; height: 38px;
      display: flex; align-items: center; justify-content: center;
      background: transparent; color: var(--text);
      border-radius: 10px;
    }
    .icon-btn:active { background: var(--border); }

    .map-wrap { flex: 1; position: relative; }
    #map { position: absolute; inset: 0; }

    .peer-strip {
      position: absolute; top: 8px; left: 8px; right: 8px;
      display: flex; gap: 6px; overflow-x: auto;
      padding: 4px 0; z-index: 400;
      -webkit-overflow-scrolling: touch;
    }
    .peer-strip::-webkit-scrollbar { display: none; }
    .peer-chip {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 10px; border-radius: 999px;
      background: rgba(255,255,255,0.95); color: #1d1d1f;
      font-size: 13px; font-weight: 600;
      box-shadow: 0 1px 3px rgba(0,0,0,.12);
      flex-shrink: 0;
      white-space: nowrap;
    }
    .peer-chip .dot { width: 10px; height: 10px; border-radius: 50%; }
    .peer-chip.ptt-on { box-shadow: 0 0 0 2px var(--primary), 0 1px 3px rgba(0,0,0,.2); }
    .peer-chip .dist { color: #6e6e73; font-weight: 500; font-size: 12px; }

    /* ─── 底部對講機 ─── */
    .bottombar {
      background: var(--card); border-top: 1px solid var(--border);
      padding: 12px 14px calc(12px + var(--safe-bottom));
      display: flex; flex-direction: column; gap: 10px;
    }
    .ptt-row { display: flex; gap: 8px; align-items: center; }
    .ptt {
      flex: 1;
      min-height: 64px;
      border-radius: 18px;
      background: var(--primary); color: #fff;
      font-size: 18px; font-weight: 700;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: background .1s, transform .05s;
      user-select: none; -webkit-user-select: none; touch-action: none;
    }
    .ptt.holding { background: var(--danger); transform: scale(.99); }
    .ptt.disabled { background: var(--border); color: var(--text-dim); }
    .mode-toggle {
      width: 64px; height: 64px;
      border-radius: 18px;
      background: var(--card); border: 1px solid var(--border);
      color: var(--text);
      display: flex; align-items: center; justify-content: center;
      font-size: 22px;
    }
    .mode-toggle.active { background: var(--primary); color: #fff; border-color: var(--primary); }

    .status-line {
      font-size: 12px; color: var(--text-dim); text-align: center;
      min-height: 16px;
    }
    .status-line.error { color: var(--danger); }

    /* ─── 邀請對話框 ─── */
    .modal-mask {
      position: fixed; inset: 0; background: rgba(0,0,0,.4);
      display: none; align-items: center; justify-content: center;
      padding: 20px; z-index: 1000;
    }
    .modal-mask.show { display: flex; }
    .modal {
      width: 100%; max-width: 380px;
      background: var(--card); border-radius: 18px;
      padding: 22px;
      box-shadow: var(--shadow);
    }
    .modal h3 { margin: 0 0 14px; font-size: 18px; }
    .invite-code {
      font-family: ui-monospace, Menlo, monospace;
      font-size: 36px; font-weight: 800; letter-spacing: 8px;
      text-align: center; padding: 16px;
      background: var(--bg); border-radius: 12px;
      margin: 12px 0;
    }
    .invite-url {
      padding: 10px 12px; background: var(--bg); border-radius: 8px;
      font-size: 12px; color: var(--text-dim);
      word-break: break-all; user-select: all;
      margin-bottom: 12px;
    }
    .modal-actions { display: flex; gap: 8px; }
    .modal-actions .btn { flex: 1; }

    /* ─── Toast ─── */
    .toast {
      position: fixed; left: 50%; top: 16px;
      transform: translateX(-50%) translateY(-200%);
      background: rgba(0,0,0,.85); color: #fff;
      padding: 10px 18px; border-radius: 999px;
      font-size: 14px; z-index: 2000;
      transition: transform .25s ease;
      pointer-events: none;
      max-width: 90%;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }

    /* ─── Leaflet popup 客製 ─── */
    .leaflet-popup-content { margin: 8px 12px; font-size: 13px; }
    .marker-pin {
      width: 28px; height: 28px;
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      border: 2px solid #fff;
      box-shadow: 0 2px 4px rgba(0,0,0,.3);
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-weight: 700; font-size: 12px;
    }
    .marker-pin span { transform: rotate(45deg); }
    .marker-pin.me::after {
      content: ''; position: absolute;
      width: 50px; height: 50px;
      border: 2px solid currentColor;
      border-radius: 50%; opacity: .25;
      animation: pulse 2s infinite;
      transform: rotate(45deg) translate(-12px, -12px);
    }
    @keyframes pulse {
      0%   { transform: rotate(45deg) translate(-12px, -12px) scale(0.6); opacity: .5; }
      100% { transform: rotate(45deg) translate(-12px, -12px) scale(1.4); opacity: 0; }
    }

    /* ─── 距離表面板（從底部滑出）─── */
    .sheet-mask {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.45);
      opacity: 0; pointer-events: none;
      transition: opacity .2s ease;
      z-index: 900;
    }
    .sheet-mask.show { opacity: 1; pointer-events: auto; }
    .sheet {
      position: fixed; left: 0; right: 0; bottom: 0;
      max-height: 75vh;
      background: var(--card);
      border-top-left-radius: 18px;
      border-top-right-radius: 18px;
      box-shadow: 0 -2px 16px rgba(0,0,0,.18);
      transform: translateY(110%);
      transition: transform .25s ease;
      z-index: 901;
      display: flex; flex-direction: column;
      padding-bottom: var(--safe-bottom);
    }
    .sheet.show { transform: translateY(0); }
    .sheet-handle {
      width: 36px; height: 4px; border-radius: 2px;
      background: var(--border);
      margin: 8px auto 4px;
    }
    .sheet-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 16px 4px;
    }
    .sheet-header h3 { margin: 0; font-size: 16px; }
    .sheet-list {
      flex: 1; overflow-y: auto;
      padding: 8px 8px 12px;
      -webkit-overflow-scrolling: touch;
    }
    .peer-row {
      display: grid;
      grid-template-columns: 28px 1fr auto;
      column-gap: 12px;
      align-items: center;
      padding: 12px;
      border-radius: 12px;
      background: var(--bg);
      margin-bottom: 6px;
      cursor: pointer;
    }
    .peer-row:active { transform: scale(0.99); }
    .peer-row .pdot {
      width: 28px; height: 28px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-weight: 700; font-size: 13px;
    }
    .peer-row .pname { font-weight: 600; font-size: 15px; line-height: 1.2; }
    .peer-row .pmeta {
      font-size: 12px; color: var(--text-dim); margin-top: 2px;
      display: flex; gap: 8px; flex-wrap: wrap;
    }
    .peer-row .peta {
      text-align: right;
    }
    .peer-row .peta .big {
      font-size: 18px; font-weight: 700; color: var(--primary);
      line-height: 1;
    }
    .peer-row .peta .sub {
      font-size: 11px; color: var(--text-dim); margin-top: 3px;
    }
    .peer-row.self { border: 1px dashed var(--border); }
    .peer-row.self .peta .big { color: var(--text-dim); font-size: 14px; }
    .sheet-empty {
      text-align: center; color: var(--text-dim);
      font-size: 14px; padding: 36px 16px;
    }
  </style>
</head>
<body>
  <!-- 啟動畫面：建房 / 加入 -->
  <section id="screen-home" class="screen home active">
    <div class="panel">
      <div class="brand">
        <div class="logo">🚐</div>
        <h1>GuideTalk</h1>
        <p>導遊團車對講 + 位置同步</p>
      </div>

      <div class="field">
        <label>你的暱稱（給夥伴看的）</label>
        <input id="name-input" type="text" placeholder="例：阿德 / 1 號車" maxlength="24" />
      </div>

      <button class="btn full" id="btn-create">建立新房間</button>

      <div class="divider">或</div>

      <div class="field">
        <label>輸入 6 碼房號</label>
        <div class="row">
          <input id="code-input" type="text" placeholder="ABC123" maxlength="6" autocapitalize="characters" autocomplete="off" />
          <button class="btn secondary" id="btn-join">加入</button>
        </div>
      </div>

      <p style="font-size:12px;color:var(--text-dim);text-align:center;margin:18px 0 0;line-height:1.6;">
        建議第一次使用前允許「定位」與「麥克風」權限<br>
        位置只在房間內分享，不寫入伺服器
      </p>
    </div>
  </section>

  <!-- 房間畫面 -->
  <section id="screen-room" class="screen room">
    <div class="topbar">
      <button class="icon-btn" id="btn-leave" title="離開">←</button>
      <div>
        <div class="room-code" id="room-code-display">------</div>
        <div class="room-meta" id="room-meta">— 人</div>
      </div>
      <div style="flex:1"></div>
      <button class="icon-btn" id="btn-list" title="距離表">📋</button>
      <button class="icon-btn" id="btn-invite" title="邀請">🔗</button>
      <button class="icon-btn" id="btn-recenter" title="回到我的位置">📍</button>
    </div>

    <div class="map-wrap">
      <div class="peer-strip" id="peer-strip"></div>
      <div id="map"></div>
    </div>

    <div class="bottombar">
      <div class="ptt-row">
        <button class="mode-toggle" id="btn-mode" title="切換通話模式">🎙️</button>
        <button class="ptt disabled" id="btn-ptt">
          <span id="ptt-label">準備中…</span>
        </button>
      </div>
      <div class="status-line" id="status-line"></div>
    </div>
  </section>

  <!-- 邀請對話框 -->
  <div class="modal-mask" id="invite-modal">
    <div class="modal">
      <h3>邀請夥伴加入</h3>
      <p style="margin:0;font-size:13px;color:var(--text-dim);">把房號或連結傳給其他導遊：</p>
      <div class="invite-code" id="invite-code-text"></div>
      <div class="invite-url" id="invite-url-text"></div>
      <div class="modal-actions">
        <button class="btn secondary" id="btn-copy-url">複製連結</button>
        <button class="btn" id="btn-share">分享 / LINE</button>
      </div>
      <button class="btn secondary full" id="btn-close-invite" style="margin-top:8px;">關閉</button>
    </div>
  </div>

  <!-- 距離表面板 -->
  <div class="sheet-mask" id="sheet-mask"></div>
  <div class="sheet" id="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <h3>📋 全車距離表</h3>
      <button class="icon-btn" id="btn-close-sheet">✕</button>
    </div>
    <div class="sheet-list" id="sheet-list"></div>
  </div>

  <div class="toast" id="toast"></div>

  <!-- Capacitor（iOS app 包裝時才載入到，網頁直接走 fallback） -->
  <script type="module" src="/main.js"></script>
</body>
</html>
