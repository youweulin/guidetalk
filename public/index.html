<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>kaitalk — 兩人語音盲盒</title>
  <style>
    :root {
      --bg: #0f0f1a;
      --card: #1a1a2e;
      --card-2: #232340;
      --text: #e8e0d0;
      --muted: #8a8aa0;
      --primary: #ff6b9d;
      --primary-dark: #d44d7c;
      --accent: #c084fc;
      --success: #4caf50;
      --danger: #e74c3c;
      --warning: #ffa726;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: var(--card);
      border-radius: 24px;
      padding: 32px 28px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
      text-align: center;
    }
    h1 {
      font-size: 28px;
      margin-bottom: 6px;
      background: linear-gradient(135deg, #ff6b9d, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle { color: var(--muted); font-size: 13px; margin-bottom: 24px; }

    .status {
      background: rgba(255,255,255,0.05);
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 16px;
      min-height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      text-align: center;
    }
    .pulse {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
      margin-right: 8px;
      animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    /* ─── 配對卡片（合併狀態 + 配對對方 + 自己暱稱）─── */
    .peer-card {
      display: none;
      background: linear-gradient(135deg, rgba(255,107,157,0.15), rgba(192,132,252,0.15));
      border: 1px solid rgba(255,107,157,0.3);
      border-radius: 16px;
      padding: 14px 18px;
      margin-bottom: 14px;
    }
    .peer-card.active { display: block; }
    .peer-card .pc-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--success);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 10px;
    }
    .peer-card .pc-status .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--success);
      animation: pulse 1.5s infinite;
    }
    .peer-card .pc-status.connecting { color: var(--warning); }
    .peer-card .pc-status.connecting .dot { background: var(--warning); }
    .peer-card .pc-status.failed { color: var(--danger); }
    .peer-card .pc-status.failed .dot { background: var(--danger); animation: none; }
    .peer-card .pc-names {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      font-size: 18px;
      font-weight: 700;
    }
    .peer-card .pc-names .me-name {
      color: #60cdff;
    }
    .peer-card .pc-names .arrow {
      color: var(--muted);
      font-size: 14px;
    }
    .peer-card .pc-names .peer-name {
      background: linear-gradient(135deg, #ff6b9d, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .peer-card .pc-meta {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 8px;
      font-size: 10px;
      color: var(--muted);
      font-family: ui-monospace, monospace;
    }
    .peer-card .role {
      padding: 1px 6px;
      border-radius: 8px;
      font-size: 9px;
      font-weight: 700;
    }
    .role.host { background: rgba(76,175,80,0.2); color: #81c784; }
    .role.guest { background: rgba(192,132,252,0.2); color: #c084fc; }

    /* ─── Volume Meters（雙 meter 同一行）─── */
    .meters {
      display: none;
      margin-bottom: 14px;
    }
    .meters.active { display: flex; gap: 12px; }
    .meter-col {
      flex: 1;
      min-width: 0;
      text-align: left;
    }
    .meter-label {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 5px;
    }
    .meter-label .level { font-family: ui-monospace, monospace; }
    .meter {
      height: 12px;
      background: rgba(255,255,255,0.06);
      border-radius: 6px;
      overflow: hidden;
      position: relative;
    }
    .meter-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #4caf50 0%, #ffeb3b 60%, #f44336 100%);
      border-radius: 6px;
      transition: width 0.05s linear;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s;
      margin-bottom: 10px;
    }
    button:active { transform: scale(0.97); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      box-shadow: 0 8px 24px rgba(255,107,157,0.3);
    }
    .btn-danger {
      background: var(--danger);
      color: white;
    }
    .btn-secondary {
      background: rgba(255,255,255,0.08);
      color: var(--text);
    }
    .btn-mute {
      background: rgba(255,167,38,0.15);
      color: var(--warning);
      border: 1px solid rgba(255,167,38,0.3);
      font-size: 13px;
      padding: 10px;
    }
    .btn-mute.muted {
      background: rgba(231,76,60,0.2);
      color: var(--danger);
      border-color: rgba(231,76,60,0.4);
    }
    .btn-subtitle {
      background: rgba(96,205,255,0.12);
      color: #60cdff;
      border: 1px solid rgba(96,205,255,0.3);
      font-size: 13px;
      padding: 10px;
    }
    .btn-subtitle.off {
      background: rgba(255,255,255,0.05);
      color: var(--muted);
      border-color: rgba(255,255,255,0.1);
    }

    .input {
      width: 100%;
      padding: 13px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.05);
      color: var(--text);
      border-radius: 12px;
      font-size: 15px;
      margin-bottom: 14px;
      text-align: center;
    }
    .input:focus { outline: none; border-color: var(--primary); }

    .log {
      margin-top: 14px;
      padding: 10px;
      background: rgba(0,0,0,0.3);
      border-radius: 8px;
      font-family: ui-monospace, 'SF Mono', Menlo, monospace;
      font-size: 10px;
      color: var(--muted);
      max-height: 100px;
      overflow-y: auto;
      text-align: left;
    }
    .hint {
      color: var(--muted);
      font-size: 11px;
      margin-top: 12px;
      line-height: 1.5;
    }

    /* ─── Subtitle control bar（字幕開關 + STT 狀態 + 語言）─── */
    .control-bar {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 8px 10px;
      background: rgba(255,255,255,0.04);
      border-radius: 12px 12px 0 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .control-bar.active { display: flex; }
    .control-bar .ctrl-btn {
      background: rgba(96,205,255,0.12);
      border: 1px solid rgba(96,205,255,0.25);
      color: #60cdff;
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      width: auto;
      margin: 0;
      transition: background 0.15s;
      white-space: nowrap;
    }
    .control-bar .ctrl-btn:hover { background: rgba(96,205,255,0.2); }
    .control-bar .ctrl-btn:active { transform: scale(0.95); }
    .control-bar .ctrl-btn.off {
      background: rgba(255,255,255,0.04);
      border-color: rgba(255,255,255,0.1);
      color: var(--muted);
    }

    /* ─── Subtitles (純訊息區，可滑動) ─── */
    .subtitles {
      display: none;
      background: rgba(0,0,0,0.35);
      border-radius: 0 0 14px 14px;
      padding: 12px;
      margin-bottom: 14px;
      max-height: 220px;
      overflow-y: auto;
      text-align: left;
      scroll-behavior: smooth;
    }
    .subtitles.active { display: block; }
    .stt-status {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 6px;
      margin-left: 6px;
    }
    .stt-status .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #666;
    }
    .stt-status.idle { background: rgba(255,255,255,0.05); color: var(--muted); }
    .stt-status.idle .dot { background: #666; }
    .stt-status.starting { background: rgba(255,167,38,0.15); color: var(--warning); }
    .stt-status.starting .dot { background: var(--warning); animation: pulse 0.8s infinite; }
    .stt-status.active { background: rgba(76,175,80,0.15); color: var(--success); }
    .stt-status.active .dot { background: var(--success); animation: pulse 1.5s infinite; }
    .stt-status.error { background: rgba(231,76,60,0.15); color: var(--danger); }
    .stt-status.error .dot { background: var(--danger); }
    .subtitle-line {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
      animation: fadeIn 0.2s ease-out;
    }
    .subtitle-line:last-child { margin-bottom: 0; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    .subtitle-line .speaker {
      flex-shrink: 0;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 8px;
      height: fit-content;
      white-space: nowrap;
    }
    .subtitle-line.self .speaker {
      background: rgba(96,205,255,0.18);
      color: #60cdff;
    }
    .subtitle-line.peer .speaker {
      background: rgba(255,107,157,0.2);
      color: var(--primary);
    }
    .subtitle-line .text-wrap {
      flex: 1;
      min-width: 0;
    }
    .subtitle-line .text {
      font-size: 14px;
      line-height: 1.45;
      color: var(--text);
      word-break: break-word;
    }
    .subtitle-line .translation {
      font-size: 13px;
      line-height: 1.4;
      color: #c084fc;
      word-break: break-word;
      margin-top: 2px;
      padding-left: 2px;
      animation: fadeIn 0.25s ease-out;
    }
    .subtitle-line.interim .text {
      color: var(--muted);
      font-style: italic;
    }
    .subtitles-empty {
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      padding: 12px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>kaitalk</h1>
    <p class="subtitle">兩人隨機語音盲盒 · Phase 0</p>

    <div id="status" class="status">準備中...</div>

    <!-- 合併卡片：狀態 + 你 ↔ 對方 + 房號角色 -->
    <div id="peer-card" class="peer-card">
      <div id="pc-status" class="pc-status">
        <span class="dot"></span>
        <span id="peer-status-text">通話中</span>
      </div>
      <div class="pc-names">
        <span class="me-name" id="me-name-display">你</span>
        <span class="arrow">↔</span>
        <span class="peer-name" id="peer-name">—</span>
      </div>
      <div class="pc-meta">
        <span>房號 <span id="room-code">—</span></span>
        <span class="role" id="my-role">—</span>
      </div>
    </div>

    <!-- 音量 meter（雙 meter 同一行） -->
    <div id="meters" class="meters">
      <div class="meter-col">
        <div class="meter-label">
          <span>🎤 你</span>
          <span class="level" id="local-level">0%</span>
        </div>
        <div class="meter">
          <div class="meter-fill" id="local-meter"></div>
        </div>
      </div>
      <div class="meter-col">
        <div class="meter-label">
          <span>🔊 對方</span>
          <span class="level" id="remote-level">0%</span>
        </div>
        <div class="meter">
          <div class="meter-fill" id="remote-meter"></div>
        </div>
      </div>
    </div>

    <!-- 控制列：字幕開關 + STT 狀態 + 語言（直接在字幕區上方）-->
    <div id="control-bar" class="control-bar">
      <button id="btn-subtitle" class="ctrl-btn">💬 字幕：開</button>
      <span id="stt-status" class="stt-status idle"><span class="dot"></span>未啟動</span>
      <button id="lang-btn" class="ctrl-btn">🇹🇼 中文</button>
    </div>

    <!-- 字幕（通話中才顯示，純訊息流可滑動）-->
    <div id="subtitles" class="subtitles">
      <div id="subtitles-list">
        <div class="subtitles-empty">等待字幕辨識啟動...</div>
      </div>
    </div>

    <input id="name" class="input" placeholder="暱稱（選填）" maxlength="12">

    <button id="btn-start" class="btn-primary">🎤 開始配對</button>
    <button id="btn-cancel" class="btn-secondary" style="display:none">取消配對</button>
    <button id="btn-mute" class="btn-mute" style="display:none">🔊 喇叭：開（單機測試請按靜音）</button>
    <button id="btn-hangup" class="btn-danger" style="display:none">📞 掛斷</button>

    <p class="hint">
      <strong>同一台電腦測試：</strong>開兩個分頁，按「開始配對」配上後，<br>
      把兩邊的喇叭都靜音 → 對著一邊講話 → 另一邊的「對方聲音」meter 會跳動 = 成功
    </p>

    <div id="log" class="log"></div>
  </div>

  <audio id="remote-audio" autoplay playsinline></audio>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/main.js"></script>
</body>
</html>
