<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>kaitalk — 兩人語音盲盒</title>
  <style>
    :root {
      --bg: #0f0f1a;
      --card: #1a1a2e;
      --card-2: #232340;
      --text: #e8e0d0;
      --muted: #8a8aa0;
      --primary: #ff6b9d;
      --primary-dark: #d44d7c;
      --accent: #c084fc;
      --success: #4caf50;
      --danger: #e74c3c;
      --warning: #ffa726;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: var(--card);
      border-radius: 24px;
      padding: 32px 28px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
      text-align: center;
    }
    h1 {
      font-size: 28px;
      margin-bottom: 6px;
      background: linear-gradient(135deg, #ff6b9d, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle { color: var(--muted); font-size: 13px; margin-bottom: 24px; }

    .status {
      background: rgba(255,255,255,0.05);
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 16px;
      min-height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      text-align: center;
    }
    .pulse {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
      margin-right: 8px;
      animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    /* ─── 配對中卡片 ─── */
    .peer-card {
      display: none;
      background: linear-gradient(135deg, rgba(255,107,157,0.15), rgba(192,132,252,0.15));
      border: 1px solid rgba(255,107,157,0.3);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 16px;
    }
    .peer-card.active { display: block; }
    .peer-card .label {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 6px;
    }
    .peer-card .name {
      font-size: 22px;
      font-weight: 700;
      background: linear-gradient(135deg, #ff6b9d, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 4px;
    }
    .peer-card .meta {
      font-size: 11px;
      color: var(--muted);
      font-family: ui-monospace, monospace;
    }
    .peer-card .role {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 10px;
      font-weight: 600;
      margin-top: 8px;
    }
    .role.host { background: rgba(76,175,80,0.2); color: #81c784; }
    .role.guest { background: rgba(192,132,252,0.2); color: #c084fc; }

    /* ─── Volume Meters（條狀 EQ + 語言徽章）─── */
    .meters {
      display: none;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 14px;
      padding: 12px 14px;
      background: rgba(255,255,255,0.04);
      border-radius: 14px;
    }
    .meters.active { display: flex; }
    .meter-row {
      display: flex;
      align-items: center;
      gap: 10px;
      height: 24px;
    }
    .meter-row .who {
      flex-shrink: 0;
      width: 32px;
      font-size: 11px;
      color: var(--muted);
      font-weight: 600;
    }
    .meter-row .eq {
      flex: 1;
      height: 24px;
      display: flex;
      align-items: center;
      gap: 3px;
      min-width: 0;
    }
    .meter-row .eq .bar {
      flex: 1;
      height: 4px;          /* 預設靜音時 4px */
      background: #4a4a5a;   /* 灰色（預設未啟動）*/
      border-radius: 2px;
      transition: height 0.06s ease-out, background 0.3s;
    }
    /* 你的麥克風 STT 啟動時：條子變綠 */
    .meter-row.local.active .bar {
      background: #4caf50;
    }
    /* 對方音訊：藍紫色 */
    .meter-row.remote .bar {
      background: #c084fc;
    }
    .meter-row .lang-badge {
      flex-shrink: 0;
      padding: 3px 8px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
      background: rgba(96,205,255,0.12);
      color: #60cdff;
      border: 1px solid rgba(96,205,255,0.25);
    }
    .meter-row .lang-badge.clickable {
      cursor: pointer;
      transition: background 0.15s;
    }
    .meter-row .lang-badge.clickable:hover {
      background: rgba(96,205,255,0.2);
    }
    .meter-row .lang-badge.clickable:active {
      transform: scale(0.95);
    }
    .meter-row .lang-badge.unknown {
      background: rgba(255,255,255,0.05);
      color: var(--muted);
      border-color: rgba(255,255,255,0.1);
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s;
      margin-bottom: 10px;
    }
    button:active { transform: scale(0.97); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      box-shadow: 0 8px 24px rgba(255,107,157,0.3);
    }
    .btn-danger {
      background: var(--danger);
      color: white;
    }
    .btn-secondary {
      background: rgba(255,255,255,0.08);
      color: var(--text);
    }
    .btn-mute {
      background: rgba(255,167,38,0.15);
      color: var(--warning);
      border: 1px solid rgba(255,167,38,0.3);
      font-size: 13px;
      padding: 10px;
    }
    .btn-mute.muted {
      background: rgba(231,76,60,0.2);
      color: var(--danger);
      border-color: rgba(231,76,60,0.4);
    }
    .btn-subtitle {
      background: rgba(96,205,255,0.12);
      color: #60cdff;
      border: 1px solid rgba(96,205,255,0.3);
      font-size: 13px;
      padding: 10px;
    }
    .btn-subtitle.off {
      background: rgba(255,255,255,0.05);
      color: var(--muted);
      border-color: rgba(255,255,255,0.1);
    }

    .input {
      width: 100%;
      padding: 13px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.05);
      color: var(--text);
      border-radius: 12px;
      font-size: 15px;
      margin-bottom: 14px;
      text-align: center;
    }
    .input:focus { outline: none; border-color: var(--primary); }

    .log {
      margin-top: 14px;
      padding: 10px;
      background: rgba(0,0,0,0.3);
      border-radius: 8px;
      font-family: ui-monospace, 'SF Mono', Menlo, monospace;
      font-size: 10px;
      color: var(--muted);
      max-height: 100px;
      overflow-y: auto;
      text-align: left;
    }
    .hint {
      color: var(--muted);
      font-size: 11px;
      margin-top: 12px;
      line-height: 1.5;
    }

    /* ─── Subtitles ─── */
    .subtitles {
      display: none;
      background: rgba(0,0,0,0.35);
      border-radius: 0 0 14px 14px;
      padding: 12px;
      margin-bottom: 14px;
      max-height: 200px;
      overflow-y: auto;
      text-align: left;
      scroll-behavior: smooth;
    }
    .subtitles.active { display: block; }
    .subtitles-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .subtitles-header .lang-btn {
      background: rgba(255,255,255,0.08);
      border: none;
      color: var(--muted);
      padding: 3px 8px;
      border-radius: 8px;
      font-size: 10px;
      cursor: pointer;
      width: auto;
      margin: 0;
    }
    .subtitles-header .lang-btn:hover { color: var(--text); }

    /* ─── Lang bar：固定在字幕上方，永遠不會被滑掉 ─── */
    .lang-bar {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 12px;
      background: rgba(255,255,255,0.04);
      border-radius: 12px 12px 0 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      margin-bottom: -14px;  /* 跟下面的 subtitles 視覺上連起來 */
      font-size: 11px;
      color: var(--muted);
    }
    .lang-bar.active { display: flex; }
    .lang-bar .label {
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .lang-bar .right {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .lang-bar .lang-btn {
      background: rgba(96,205,255,0.12);
      border: 1px solid rgba(96,205,255,0.25);
      color: #60cdff;
      padding: 5px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      width: auto;
      margin: 0;
      transition: background 0.15s;
    }
    .lang-bar .lang-btn:hover { background: rgba(96,205,255,0.2); }
    .stt-status {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 6px;
      margin-left: 6px;
    }
    .stt-status .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #666;
    }
    .stt-status.idle { background: rgba(255,255,255,0.05); color: var(--muted); }
    .stt-status.idle .dot { background: #666; }
    .stt-status.starting { background: rgba(255,167,38,0.15); color: var(--warning); }
    .stt-status.starting .dot { background: var(--warning); animation: pulse 0.8s infinite; }
    .stt-status.active { background: rgba(76,175,80,0.15); color: var(--success); }
    .stt-status.active .dot { background: var(--success); animation: pulse 1.5s infinite; }
    .stt-status.error { background: rgba(231,76,60,0.15); color: var(--danger); }
    .stt-status.error .dot { background: var(--danger); }
    .subtitle-line {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
      animation: fadeIn 0.2s ease-out;
    }
    .subtitle-line:last-child { margin-bottom: 0; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    .subtitle-line .speaker {
      flex-shrink: 0;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 8px;
      height: fit-content;
      white-space: nowrap;
    }
    .subtitle-line.self .speaker {
      background: rgba(96,205,255,0.18);
      color: #60cdff;
    }
    .subtitle-line.peer .speaker {
      background: rgba(255,107,157,0.2);
      color: var(--primary);
    }
    .subtitle-line .text-wrap {
      flex: 1;
      min-width: 0;
    }
    .subtitle-line .text {
      font-size: 14px;
      line-height: 1.45;
      color: var(--text);
      word-break: break-word;
    }
    .subtitle-line .translation {
      font-size: 13px;
      line-height: 1.4;
      color: #c084fc;
      word-break: break-word;
      margin-top: 2px;
      padding-left: 2px;
      animation: fadeIn 0.25s ease-out;
    }
    .subtitle-line.interim .text {
      color: var(--muted);
      font-style: italic;
    }
    .subtitles-empty {
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      padding: 12px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>kaitalk</h1>
    <p class="subtitle">兩人隨機語音盲盒 · Phase 0</p>

    <div id="status" class="status">準備中...</div>

    <!-- 配對成功後的對方資訊卡 -->
    <div id="peer-card" class="peer-card">
      <div class="label">與你配對的是</div>
      <div class="name" id="peer-name">—</div>
      <div class="meta">
        房號 <span id="room-code">—</span>
        <span class="role" id="my-role">—</span>
      </div>
    </div>

    <!-- 音量 meter（條狀 EQ + 語言徽章）-->
    <div id="meters" class="meters">
      <div class="meter-row local" id="meter-row-local">
        <span class="who">你</span>
        <div class="eq" id="local-eq">
          <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
          <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
        </div>
        <span class="lang-badge clickable" id="lang-btn">🇹🇼 中文</span>
      </div>
      <div class="meter-row remote">
        <span class="who">對方</span>
        <div class="eq" id="remote-eq">
          <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
          <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
        </div>
        <span class="lang-badge unknown" id="peer-lang-badge">？</span>
      </div>
    </div>

    <!-- 隱藏：原本的 stt-status 還保留給 main.js 用，但不顯示 -->
    <span id="stt-status" class="stt-status idle" style="display:none"><span class="dot"></span></span>

    <!-- 字幕（通話中才顯示）-->
    <div id="subtitles" class="subtitles">
      <div id="subtitles-list">
        <div class="subtitles-empty">等待字幕辨識啟動...</div>
      </div>
    </div>

    <input id="name" class="input" placeholder="暱稱（選填）" maxlength="12">

    <button id="btn-start" class="btn-primary">🎤 開始配對</button>
    <button id="btn-cancel" class="btn-secondary" style="display:none">取消配對</button>
    <button id="btn-subtitle" class="btn-subtitle" style="display:none">💬 字幕：開</button>
    <button id="btn-mute" class="btn-mute" style="display:none">🔊 喇叭：開（單機測試請按靜音）</button>
    <button id="btn-hangup" class="btn-danger" style="display:none">📞 掛斷</button>

    <p class="hint">
      <strong>同一台電腦測試：</strong>開兩個分頁，按「開始配對」配上後，<br>
      把兩邊的喇叭都靜音 → 對著一邊講話 → 另一邊的「對方聲音」meter 會跳動 = 成功
    </p>

    <div id="log" class="log"></div>
  </div>

  <audio id="remote-audio" autoplay playsinline></audio>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/main.js"></script>
</body>
</html>
