<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KaiTalk Admin</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #1a1a2e; color: #e0e0e0; padding: 20px; }
    h1 { font-size: 22px; margin-bottom: 20px; color: #b388ff; }
    h2 { font-size: 16px; margin: 24px 0 12px; color: #9b8ce8; }
    .login { max-width: 300px; margin: 100px auto; text-align: center; }
    .login input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #333; background: #222; color: #fff; font-size: 14px; margin-bottom: 12px; }
    .login button { width: 100%; padding: 12px; border-radius: 10px; border: none; background: #7c6dd8; color: #fff; font-weight: 700; cursor: pointer; }
    .dashboard { display: none; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 24px; }
    .stat-card { background: #222; border-radius: 14px; padding: 16px; text-align: center; }
    .stat-num { font-size: 28px; font-weight: 800; color: #b388ff; }
    .stat-label { font-size: 12px; color: #888; margin-top: 4px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; padding: 8px 10px; background: #222; color: #888; font-weight: 600; }
    td { padding: 8px 10px; border-bottom: 1px solid #2a2a3e; }
    .badge { padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; }
    .badge-pending { background: #ff950033; color: #ff9500; }
    .badge-resolved { background: #34c75933; color: #34c759; }
    .badge-banned { background: #ff3b3033; color: #ff3b30; }
    .btn-sm { padding: 4px 10px; border-radius: 6px; border: none; font-size: 11px; font-weight: 600; cursor: pointer; margin: 0 2px; }
    .btn-warn { background: #ff950033; color: #ff9500; }
    .btn-ban { background: #ff3b3033; color: #ff3b30; }
    .btn-dismiss { background: #34c75933; color: #34c759; }
    .evidence { max-height: 200px; overflow-y: auto; background: #1a1a1a; padding: 10px; border-radius: 8px; font-size: 12px; margin-top: 6px; }
    .evidence-line { margin-bottom: 4px; }
    .evidence-line.self { color: #7c6dd8; }
    .evidence-line.peer { color: #e0e0e0; }
    .refresh-btn { padding: 8px 16px; border-radius: 8px; border: none; background: #333; color: #fff; cursor: pointer; font-size: 12px; margin-bottom: 12px; }
    .user-lookup { display: flex; gap: 8px; margin-bottom: 16px; }
    .user-lookup input { flex: 1; padding: 8px 12px; border-radius: 8px; border: 1px solid #333; background: #222; color: #fff; font-size: 13px; }
    .user-lookup button { padding: 8px 16px; border-radius: 8px; border: none; background: #7c6dd8; color: #fff; font-weight: 600; cursor: pointer; }
    .user-detail { background: #222; border-radius: 12px; padding: 16px; margin-bottom: 16px; display: none; }
    .user-detail p { margin: 4px 0; font-size: 13px; }
    .karma-bar { height: 8px; border-radius: 4px; background: #333; margin-top: 4px; }
    .karma-fill { height: 100%; border-radius: 4px; transition: width 0.3s; }
  </style>
</head>
<body>
  <div class="login" id="login">
    <h1>KaiTalk Admin</h1>
    <input type="password" id="admin-pw" placeholder="管理密碼">
    <button onclick="doLogin()">登入</button>
  </div>

  <div class="dashboard" id="dashboard">
    <h1>KaiTalk Admin Dashboard</h1>
    <button class="refresh-btn" onclick="loadAll()">重新整理</button>

    <div class="stats" id="stats"></div>

    <h2>用戶查詢</h2>
    <div class="user-lookup">
      <input type="text" id="user-search" placeholder="輸入用戶 ID 或暱稱">
      <button onclick="lookupUser()">查詢</button>
    </div>
    <div class="user-detail" id="user-detail"></div>

    <h2>待處理檢舉</h2>
    <div id="reports-pending"></div>

    <h2>最近懲罰</h2>
    <div id="penalties-recent"></div>

    <h2>最近檢舉（全部）</h2>
    <div id="reports-all"></div>
  </div>

  <script>
    let adminToken = '';

    function doLogin() {
      adminToken = document.getElementById('admin-pw').value;
      loadAll().then(ok => {
        if (ok) {
          document.getElementById('login').style.display = 'none';
          document.getElementById('dashboard').style.display = 'block';
        } else {
          alert('密碼錯誤');
        }
      });
    }

    async function apiFetch(path) {
      const r = await fetch(path, { headers: { 'X-Admin-Key': adminToken } });
      if (r.status === 401) return null;
      return r.json();
    }

    async function apiPost(path, body) {
      const r = await fetch(path, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Admin-Key': adminToken },
        body: JSON.stringify(body),
      });
      return r.json();
    }

    async function loadAll() {
      const data = await apiFetch('/admin/api/overview');
      if (!data) return false;

      document.getElementById('stats').innerHTML = `
        <div class="stat-card"><div class="stat-num">${data.totalUsers}</div><div class="stat-label">用戶總數</div></div>
        <div class="stat-card"><div class="stat-num">${data.totalCalls}</div><div class="stat-label">總通話數</div></div>
        <div class="stat-card"><div class="stat-num">${data.pendingReports}</div><div class="stat-label">待處理檢舉</div></div>
        <div class="stat-card"><div class="stat-num">${data.activeBans}</div><div class="stat-label">目前封禁</div></div>
        <div class="stat-card"><div class="stat-num">${data.todayReports}</div><div class="stat-label">今日檢舉</div></div>
        <div class="stat-card"><div class="stat-num">${data.todayCalls}</div><div class="stat-label">今日通話</div></div>
      `;

      // Pending reports
      const pending = await apiFetch('/admin/api/reports?status=pending');
      renderReports(pending?.reports || [], 'reports-pending', true);

      // All reports
      const all = await apiFetch('/admin/api/reports?limit=20');
      renderReports(all?.reports || [], 'reports-all', false);

      // Recent penalties
      const penalties = await apiFetch('/admin/api/penalties');
      renderPenalties(penalties?.penalties || []);

      return true;
    }

    function renderReports(reports, containerId, showActions) {
      const el = document.getElementById(containerId);
      if (reports.length === 0) {
        el.innerHTML = '<p style="color:#666;font-size:13px;">沒有紀錄</p>';
        return;
      }
      el.innerHTML = `<table>
        <tr><th>時間</th><th>檢舉人</th><th>被檢舉</th><th>原因</th><th>狀態</th>${showActions ? '<th>操作</th>' : ''}<th>證據</th></tr>
        ${reports.map(r => `
          <tr>
            <td>${new Date(r.reported_at).toLocaleString('zh-TW')}</td>
            <td title="${r.reporter_id}">${(r.reporter_name || r.reporter_id?.slice(0,8)) || '?'}</td>
            <td title="${r.reported_id}">${(r.reported_name || r.reported_id?.slice(0,8)) || '?'}</td>
            <td>${r.reason}</td>
            <td><span class="badge badge-${r.status}">${r.status}</span></td>
            ${showActions ? `<td>
              <button class="btn-sm btn-warn" onclick="resolveReport(${r.id},'warning')">警告</button>
              <button class="btn-sm btn-ban" onclick="resolveReport(${r.id},'temp_ban')">封禁</button>
              <button class="btn-sm btn-dismiss" onclick="resolveReport(${r.id},'no_action')">不處理</button>
            </td>` : ''}
            <td><button class="btn-sm" style="background:#333;color:#aaa;" onclick="toggleEvidence(this, '${r.id}')">查看</button>
              <div class="evidence" style="display:none" id="ev-${r.id}">${formatEvidence(r.evidence_snapshot)}</div>
            </td>
          </tr>
        `).join('')}
      </table>`;
    }

    function formatEvidence(snapshot) {
      if (!snapshot) return '<em>無證據</em>';
      try {
        const msgs = typeof snapshot === 'string' ? JSON.parse(snapshot) : snapshot;
        return msgs.map(m => `<div class="evidence-line ${m.speaker}">${m.speaker === 'self' ? '檢舉人' : '被檢舉'}：${m.text || ''}</div>`).join('');
      } catch { return '<em>格式錯誤</em>'; }
    }

    function toggleEvidence(btn, id) {
      const el = document.getElementById('ev-' + id);
      el.style.display = el.style.display === 'none' ? 'block' : 'none';
    }

    function renderPenalties(penalties) {
      const el = document.getElementById('penalties-recent');
      if (penalties.length === 0) {
        el.innerHTML = '<p style="color:#666;font-size:13px;">沒有紀錄</p>';
        return;
      }
      el.innerHTML = `<table>
        <tr><th>時間</th><th>用戶</th><th>處罰</th><th>原因</th><th>詳情</th><th>到期</th></tr>
        ${penalties.map(p => `
          <tr>
            <td>${new Date(p.created_at).toLocaleString('zh-TW')}</td>
            <td title="${p.user_id}">${(p.user_name || p.user_id?.slice(0,8)) || '?'}</td>
            <td><span class="badge badge-banned">${p.action}</span></td>
            <td>${p.reason}</td>
            <td>${p.details || ''}</td>
            <td>${p.expires_at ? new Date(p.expires_at).toLocaleString('zh-TW') : '永久'}</td>
          </tr>
        `).join('')}
      </table>`;
    }

    async function resolveReport(reportId, resolution) {
      await apiPost('/admin/api/reports/resolve', { reportId, resolution });
      loadAll();
    }

    async function lookupUser() {
      const q = document.getElementById('user-search').value.trim();
      if (!q) return;
      const data = await apiFetch('/admin/api/user?q=' + encodeURIComponent(q));
      const el = document.getElementById('user-detail');
      if (!data?.user) {
        el.style.display = 'block';
        el.innerHTML = '<p>找不到用戶</p>';
        return;
      }
      const u = data.user;
      const karmaColor = u.karma > 50 ? '#34c759' : u.karma > 20 ? '#ff9500' : '#ff3b30';
      el.style.display = 'block';
      el.innerHTML = `
        <p><strong>${u.nickname || '(no name)'}</strong> <span style="color:#666">${u.id}</span></p>
        <p>Karma: <strong style="color:${karmaColor}">${u.karma}</strong>/200
          <div class="karma-bar"><div class="karma-fill" style="width:${Math.max(0, (u.karma + 100) / 300 * 100)}%;background:${karmaColor}"></div></div>
        </p>
        <p>通話次數: ${u.kaitalk_calls} | 狀態: ${u.auth_status} | 封禁至: ${u.banned_until || '無'}</p>
        <p>被檢舉: ${data.reportCount} 次 | 被封鎖: ${data.blockCount} 次</p>
        <button class="btn-sm btn-ban" onclick="manualBan('${u.id}')">手動封禁 7 天</button>
        <button class="btn-sm btn-dismiss" onclick="manualUnban('${u.id}')">解除封禁</button>
        <button class="btn-sm" style="background:#333;color:#aaa;" onclick="adjustKarmaUI('${u.id}')">調整 Karma</button>
      `;
    }

    async function manualBan(uid) {
      if (!confirm('確定封禁此用戶 7 天？')) return;
      await apiPost('/admin/api/user/ban', { userId: uid, hours: 168 });
      lookupUser();
    }
    async function manualUnban(uid) {
      await apiPost('/admin/api/user/unban', { userId: uid });
      lookupUser();
    }
    async function adjustKarmaUI(uid) {
      const delta = prompt('Karma 加減多少？（正數加、負數減）');
      if (delta === null) return;
      await apiPost('/admin/api/user/karma', { userId: uid, delta: parseInt(delta) });
      lookupUser();
    }
  </script>
</body>
</html>
